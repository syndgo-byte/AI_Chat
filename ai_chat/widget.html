<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 문의 · 민원</title>
<style>body{font:16px system-ui;background:#f4f6f8;color:#182331;margin:0}main{max-width:850px;margin:30px auto;padding:20px}section{background:white;border:1px solid #dce2e8;border-radius:12px;padding:20px;margin:15px 0}textarea,input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #c6d0da;border-radius:7px;margin:8px 0}textarea{min-height:85px}input[type=checkbox]{width:auto}button,a{padding:10px 16px;cursor:pointer}article{padding:10px 15px;margin:10px 0;border-radius:8px;background:#edf2f7;white-space:pre-wrap}article.user{margin-left:20%;background:#e4f2ff}small{color:#5c6b7a}#error{color:#a32028;white-space:pre-wrap}label{display:block}</style>
<main><a href="/">서비스로 돌아가기</a><h1>AI 문의 · 민원</h1><p>승인된 안내는 바로 답변하고, 확인이 필요한 문의는 민원 초안으로 정리합니다.</p><button id="new">새 대화</button><p id="error" role="alert"></p><section id="conversation" aria-live="polite"></section>
<section><form id="composer"><label><input id="consent" type="checkbox">대화를 Google AI에 전송하는 데 동의합니다.</label><small>연락처·식별번호 패턴은 전송 전 가립니다. 비밀번호는 입력하지 마세요.</small><textarea id="message" placeholder="Enter 전송 · Shift+Enter 줄바꿈" maxlength="8000" required></textarea><button id="send">보내기</button></form></section>
<section id="draft" hidden><h2>민원 초안</h2><p id="decision"></p><p id="missing"></p><label>제목<input id="title" maxlength="200"></label><label>내용<textarea id="body" maxlength="10000"></textarea></label><label><input type="checkbox" id="email-notify" disabled> 가입 이메일로도 답변 받기</label><small id="email-hint">이메일 수신 가능 여부 확인 중…</small><button id="submit">내용 확인 · 민원 접수</button><p id="status"></p><button id="refresh" type="button">처리 상태 · 담당자 답변 확인</button><div id="replies"></div></section></main>
<script>
let session=null,busy=false; const el=id=>document.getElementById(id);
async function request(path,method='GET',body){const r=await fetch('/api/support'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'입력값을 확인하세요.');return data;}
function render(next){session=next;sessionStorage.setItem('support-session',session.id);el('conversation').replaceChildren();for(const m of session.messages){const a=document.createElement('article');a.className=m.role;a.textContent=(m.role==='user'?'나: ':'AI: ')+m.content;el('conversation').append(a);}el('draft').hidden=!session.draft;if(session.draft){el('title').value=session.draft.title;el('body').value=session.draft.body;el('missing').textContent=session.missing_fields.join(' · ');}el('decision').textContent=session.decision?(session.decision.answerable?'승인된 답변 자동 응답':'담당자 검토')+' · '+session.decision.category:'';el('status').textContent=session.complaint_id?'민원 #'+session.complaint_id+' 접수 완료':'';el('submit').disabled=!!session.complaint_id;el('replies').replaceChildren();if(session.receipt){el('status').textContent+=' · '+session.receipt.status;if(session.receipt.resolution){const p=document.createElement('p');p.textContent=session.receipt.resolution;el('replies').append(p);}for(const message of session.receipt.messages){const p=document.createElement('p');p.textContent=message.body;el('replies').append(p);}}}
async function act(work){if(busy)return;busy=true;el('send').disabled=true;el('error').textContent='';try{await work();}catch(e){el('error').textContent=e.message;}finally{busy=false;el('send').disabled=false;}}
el('new').onclick=()=>act(async()=>render(await request('/sessions','POST')));
el('composer').onsubmit=e=>{e.preventDefault();if(!el('consent').checked){el('error').textContent='대화 전송 동의가 필요합니다.';return;}const content=el('message').value.trim();if(!content)return;act(async()=>{if(!session)render(await request('/sessions','POST'));render(await request('/sessions/'+session.id+'/messages','POST',{content,expected_version:session.version,allow_external_processing:true}));el('message').value='';});};
el('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!busy)el('composer').requestSubmit();}};
el('submit').onclick=()=>act(async()=>{if(!session||session.complaint_id)return;const title=el('title').value.trim(),body=el('body').value.trim();if(title!==session.draft.title||body!==session.draft.body)render(await request('/sessions/'+session.id+'/draft','PUT',{title,body,expected_version:session.version}));const result=await request('/sessions/'+session.id+'/complaint','POST',{expected_version:session.version,confirmed:true,email_notify:el('email-notify').checked});render(result.session);});
el('refresh').onclick=()=>act(async()=>{if(session)render(await request('/sessions/'+encodeURIComponent(session.id)));});
fetch('/api/support/contact').then(r=>r.json()).then(c=>{el('email-notify').disabled=!c.email_available;el('email-hint').textContent=c.email_available?'답변은 웹 문의 내역과 선택한 가입 이메일에서 확인할 수 있습니다.':'가입 이메일이 없어 웹 문의 내역으로 답변을 안내합니다.';}).catch(()=>{el('email-hint').textContent='웹 문의 내역에서 답변을 확인할 수 있습니다.';});
const saved=sessionStorage.getItem('support-session');if(saved)act(async()=>render(await request('/sessions/'+encodeURIComponent(saved))));
</script></html>
